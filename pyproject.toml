[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphify-map"
version = "0.1.0"
description = "A complexity map of a codebase: size, tangle and connections per area, built on graphify's code graph."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "graphifyy>=0.9.92",
    "lizard>=1.17",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
graphify-map = "graphify_map.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphify_map = ["template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixture"]
