<script>
const D = __DATA__;
const LAYERS = D.layers.filter(l => l.id !== "lab").map(l => l.id);
const $ = s => document.querySelector(s);
const A = Object.fromEntries(D.areas.map(a => [a.id, a]));
const fmt = n => n >= 10000 ? Math.round(n / 1000) + "k" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NS = "http://www.w3.org/2000/svg";
const el = (n, at = {}, p) => { const e = document.createElementNS(NS, n); for (const k in at) e.setAttribute(k, at[k]); if (p) p.appendChild(e); return e; };

// ---- derived numbers
const ship = D.areas.filter(a => !a.lab);
const out = {}, inn = {};
D.areas.forEach(a => { out[a.id] = []; inn[a.id] = []; });
D.links.forEach(l => { out[l.from].push(l); inn[l.to].push(l); });
const conn = a => new Set([...out[a].map(l => l.to), ...inn[a].map(l => l.from)]).size;
const usedBy = id => inn[id].filter(l => !A[l.from].lab);
const pairs = new Set(D.links.map(l => l.from + ">" + l.to));
const mutual = D.links.filter(l => !A[l.from].lab && !A[l.to].lab && l.from < l.to && pairs.has(l.to + ">" + l.from));

const METRICS = {
  size:   { val: a => a.lines,  breaks: [2000, 4000, 6000, 9000], tick: ["<2k","2–4k","4–6k","6–9k","9k+"], title: "Size", note: "code lines, no blanks or comments." },
  tangle: { val: a => a.tangle, breaks: [20, 25, 30, 35],         tick: ["<20","20–25","25–30","30–35","35+"], title: "Tangle", note: "decision points per 100 lines. More means more paths to test." },
  conn:   { val: a => conn(a.id), breaks: [3, 5, 7, 9],           tick: ["<3","3–4","5–6","7–8","9+"], title: "Connections", note: "other areas it uses or is used by." },
};
let metric = "tangle", linkMode = "strong", showLab = true, sel = null, hl = null, query = "";
const level = (m, a) => { const v = METRICS[m].val(a); return METRICS[m].breaks.filter(b => v >= b).length; };
const mtext = (m, a) => m === "size" ? fmt(a.lines) + " lines" : m === "tangle" ? a.tangle + " per 100 lines" : conn(a.id) + " links";

// ---- layout (fixed layers, rows wrap at COLS)
// Boxes grow to fit the longest area name in the font the browser actually uses; past MAX_BW names are cut.
const MIN_BW = 184, MAX_BW = 300, BOX_PAD = 24;
function textWidth(text, cls) {
  const probe = el("svg", { style: "position:absolute;visibility:hidden" }, document.body);
  const t = el("text", { class: cls }, el("g", { class: "box" }, probe));
  t.textContent = text;
  const w = t.getComputedTextLength(); probe.remove(); return w;
}
function fitText(text, cls, maxWidth) {
  let t = text;
  while (t.length > 1 && textWidth(t, cls) > maxWidth) t = t.slice(0, -1);
  return t === text ? t : t.trimEnd() + "…";
}
const BW = Math.min(MAX_BW, Math.max(MIN_BW, ...D.areas.map(a => textWidth(a.name, "nm") + BOX_PAD))), BH = 58, GX = 20, ROWGAP = 16, COLS = 3, LABELH = 28, PAD = 16, LEFT = 12;
const pos = {}, bands = [];
let y = 8;
const layerOrder = LAYERS;
const bandW = COLS * (BW + GX) + GX;
layerOrder.forEach(lid => {
  const items = D.areas.filter(a => a.layer === lid);
  const rows = Math.ceil(items.length / COLS);
  const h = LABELH + rows * (BH + ROWGAP) - ROWGAP + PAD;
  const per = Math.min(items.length, COLS);
  items.forEach((a, i) => {
    const r = Math.floor(i / COLS), c = i % COLS, n = r === rows - 1 ? items.length - r * COLS : COLS;
    const off = (bandW - (n * (BW + GX) - GX)) / 2;
    pos[a.id] = { x: LEFT + off + c * (BW + GX), y: y + LABELH + r * (BH + ROWGAP) };
  });
  bands.push({ name: D.layers.find(l => l.id === lid).name, x: LEFT, y, w: bandW, h });
  y += h + 22;
});
const labX = LEFT + bandW + 34, labItems = D.areas.filter(a => a.lab);
const labBand = { name: "Lab only, never ships", x: labX, y: 8, w: BW + 2 * GX, h: LABELH + labItems.length * (BH + ROWGAP) + PAD - ROWGAP, lab: true };
labItems.forEach((a, i) => pos[a.id] = { x: labX + GX, y: 8 + LABELH + i * (BH + ROWGAP) });
const W = labX + labBand.w + 12, H = y;

// ---- draw
const svg = $("#map");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const defs = el("defs", {}, svg);
[["ah", "var(--edge)"], ["ahh", "var(--edge-hi)"]].forEach(([id, f]) => {
  const m = el("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" }, defs);
  el("path", { d: "M0 1 L10 5 L0 9 z", fill: f }, m);
});
const gBands = el("g", {}, svg), gEdges = el("g", {}, svg), gBoxes = el("g", {}, svg);
bands.concat([labBand]).forEach(b => {
  const g = el("g", { class: b.lab ? "labband" : "" }, gBands);
  el("rect", { class: "band", x: b.x, y: b.y, width: b.w, height: b.h, rx: 10, ...(b.lab ? { "stroke-dasharray": "6 4", stroke: "var(--line)", "stroke-width": 1.2 } : {}) }, g);
  const t = el("text", { class: "bandlabel", x: b.x + 14, y: b.y + 19 }, g); t.textContent = b.name;
});

const counts = D.links.filter(l => !A[l.from].lab).map(l => l.count).sort((a, b) => a - b);
const STRONG = counts[Math.floor(counts.length * 0.6)];
const edgeEls = [];
function rectEdge(c, o, w, h) { // point on the box border facing o
  const dx = o.x - c.x, dy = o.y - c.y;
  const s = Math.min(dx ? (w / 2) / Math.abs(dx) : 1e9, dy ? (h / 2) / Math.abs(dy) : 1e9);
  return { x: c.x + dx * s, y: c.y + dy * s };
}
D.links.forEach(l => {
  const a = pos[l.from], b = pos[l.to];
  const ca = { x: a.x + BW / 2, y: a.y + BH / 2 }, cb = { x: b.x + BW / 2, y: b.y + BH / 2 };
  const curve = 0.14;
  const mx = (ca.x + cb.x) / 2, my = (ca.y + cb.y) / 2, dx = cb.x - ca.x, dy = cb.y - ca.y;

const collapsed = {
  folder: new Set([...Object.values(NODES.folder).filter(n => n.kind === "dir" && PARENT.folder[n.id]?.kind !== "root" && n.files.length > 20).map(n => n.id), ...filesWithSymbols("folder")]),
  area: new Set([...ship.map(a => "a:" + a.id), ...filesWithSymbols("area")]),
};
const TPAD = { folder: 150, area: 4 }, ROW = 24;
const dotX = (key, d) => TPAD[key] + d * 18 + 4.5;
const yOf = row => row.i * ROW + ROW / 2;
const mkSel = n => ({ id: n.id, files: new Set(n.files), all: new Set(n.all), label: n.label.replace(/\/$/, ""), n });
let tsel = null, thover = null, FL = null;

function flatten(tree, coll) {
  const rows = [], rowOf = {};
  const walk = (n, depth, prow) => {
    let row = prow;
    if (n.kind !== "root") {
      row = { n, depth, i: rows.length, parent: prow }; rows.push(row);
      if (n.unit) rowOf[n.unit] = row;
      if (coll.has(n.id) || !n.kids.length) n.all.forEach(f => rowOf[f] = row);
    }
    if (!coll.has(n.id)) n.kids.forEach(k => walk(k, n.kind === "root" ? 0 : depth + 1, n.kind === "root" ? null : row));
  };
  walk(tree, 0, null); return { rows, rowOf };
}
function relFor(sel) {
  const out = new Map(), inn = new Map();
  sel.files.forEach(f => {
    for (const [t, c] of Object.entries(fOut[f] || {})) if (!sel.files.has(t)) out.set(t, (out.get(t) || 0) + c);
    for (const [t, c] of Object.entries(fIn[f] || {})) if (!sel.files.has(t)) inn.set(t, (inn.get(t) || 0) + c);
  });
  // a class stands for its methods, so drop a method whose class is already listed
  const prune = m => new Map([...m].filter(([u]) => !(SYM[u] && m.has(SYM[u].parent))));
  return { out: prune(out), inn: prune(inn) };
}
function reveal(nodeId) {
  for (const key of ["folder", "area"]) for (let p = PARENT[key][nodeId]; p; p = PARENT[key][p.id]) collapsed[key].delete(p.id);
}

function renderTrees() {
  FL = { folder: flatten(TR.folder, collapsed.folder), area: flatten(TR.area, collapsed.area) };
  const rowsHtml = key => FL[key].rows.map(({ n, depth }) => {
    const isColl = collapsed[key].has(n.id), group = !["file", "function", "method"].includes(n.kind);
    const dot = n.unit ? `<span class="dot" style="background:var(--r${unitLevel(n.unit)})"></span>` : `<span class="dot"></span>`;
    const more = n.unit ? `+${n.all.length - 1} ${n.kind === "class" ? "methods" : "symbols"}` : `+${n.files.length} files`;
    const tog = n.kids.length
      ? `<button class="tg" data-tog="${esc(n.id)}" aria-expanded="${!isColl}">${isColl ? more : "fold"}</button>` : "";
    return `<div class="trow ${n.kind}${group ? " group" : ""}" tabindex="0" style="padding-left:${depth * 18}px" data-k="${key}" data-id="${esc(n.id)}">${dot}<span class="lb">${esc(n.label)}<em>${fmt(n.lines)}</em></span>${tog}</div>`;
  }).join("");
  const tree = key => `<div class="tree" id="tree-${key}" style="height:${FL[key].rows.length * ROW}px;padding-left:${TPAD[key]}px">
    <svg height="${FL[key].rows.length * ROW}"><g class="lines"></g><g class="arcs"></g></svg>${rowsHtml(key)}</div>`;
  $("#trees").innerHTML = `<div class="tintro">Same code, two ways to group it. Hover or click a file, folder or area, and open a file to see its classes and functions. Arcs on the folder tree show what it uses <span class="k"></span> and what uses it <span class="k in"></span>. Everything unrelated fades. Dot shade is tangle; numbers are code lines.</div>
  <div class="trees">
    <div class="tcol"><h2>Folder tree</h2><div class="sub">Where the files sit on disk.</div>${tree("folder")}</div>
    <div class="tcol tcol-side"><div id="tcard"></div><h2>Area tree</h2><div class="sub">Which area each file belongs to.</div>${tree("area")}</div>
  </div>`;
  ["folder", "area"].forEach(drawLines);
  paintTrees();
}
function drawLines(key) {
  const kidsOf = new Map();
  FL[key].rows.forEach(r => { if (r.parent) { if (!kidsOf.has(r.parent)) kidsOf.set(r.parent, []); kidsOf.get(r.parent).push(r); } });
  let h = "";
  kidsOf.forEach((kids, p) => {
    const px = dotX(key, p.depth), last = kids[kids.length - 1];
    h += `<path class="ln" d="M${px} ${yOf(p) + 6} V${yOf(last)}"/>`;
    kids.forEach(k => h += `<path class="ln" d="M${px} ${yOf(k)} H${dotX(key, k.depth) - 5}"/>`);
  });
  $(`#tree-${key} .lines`).innerHTML = h;
}
function paintTrees() {
  if (!FL) return;
  const act = thover || tsel, rel = act ? relFor(act) : null;
  const involved = rel ? new Set([...act.all, ...rel.out.keys(), ...rel.inn.keys()]) : null;
  document.querySelectorAll("#trees .trow").forEach(el => {
    const n = NODES[el.dataset.k][el.dataset.id];
    const hot = involved && (n.all.some(f => involved.has(f)) || [...n.anc].some(f => involved.has(f)));
    el.classList.toggle("fade", !!involved && !hot);
    el.classList.toggle("hot", !!hot && n.kind !== "layer");
    el.classList.toggle("sel", !!act && act.id === n.id);
    el.classList.toggle("own", !!act && act.id !== n.id && n.all.length > 0 && n.all.every(f => act.all.has(f)));
  });
  const g = $("#tree-folder .arcs"); let h = "";
  if (rel) {
    const { rowOf } = FL.folder, seen = new Set();
    const rowsOf = fs => [...new Set([...fs].map(f => rowOf[f]).filter(Boolean))];
    const arc = (a, b, cls) => {
      if (a === b) return; const k = a.i + ">" + b.i + cls; if (seen.has(k) || seen.size > 240) return; seen.add(k);
      const x0 = dotX("folder", a.depth), x1 = dotX("folder", b.depth), y0 = yOf(a), y1 = yOf(b);
      const cx = Math.min(x0, x1) - Math.min(135, 22 + Math.abs(y1 - y0) * 0.22);
      h += `<path class="arc ${cls}" d="M${x0} ${y0} C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}"/>`;
    };
    const src = rowsOf(act.files), outR = rowsOf(rel.out.keys()), inR = rowsOf(rel.inn.keys());
    src.forEach(s => { inR.forEach(t => arc(t, s, "in")); outR.forEach(t => arc(s, t, "out")); });
  }
  g.innerHTML = h;
  paintCard();
}
function paintCard() {
  const c = $("#tcard");
  if (!tsel) { c.className = "tcard empty"; c.innerHTML = "Nothing selected. Click a row to pin it here."; return; }
  const rel = relFor(tsel), n = tsel.n;
  const decisions = n.unit ? U(n.unit).decisions : n.files.reduce((s, f) => s + FILE[f].decisions, 0);
  const tangle = n.files.length ? (100 * decisions / Math.max(n.lines, 1)).toFixed(0) : 0;
  const where = n.kind === "file" ? A[FILE[n.unit].area].name : n.unit ? `${fileName(U(n.unit).file)} · ${A[U(n.unit).area].name}` : `${n.files.length} files`;
  const noun = SYM[n.unit] ? "symbols" : "files";
  const chips = m => { const e = [...m.entries()].sort((a, b) => b[1] - a[1]);
    return e.length ? `<div class="chips">${e.slice(0, 10).map(([f, k]) => `<button class="chip" data-pick="${esc(f)}">${esc(unitLabel(f))}<small>${k}</small></button>`).join("")}${e.length > 10 ? `<span class="chip">+${e.length - 10} more</span>` : ""}</div>` : "<span>none</span>"; };
  c.className = "tcard";
  c.innerHTML = `<div class="hd"><b>${esc(tsel.label)}</b><span>${esc(where)} · ${fmt(n.lines)} lines · tangle ${tangle}</span><button data-clear>Clear</button></div>
    <div class="rl"><div><span class="k"></span> uses ${rel.out.size} ${noun}</div>${chips(rel.out)}
    <div><span class="k in"></span> used by ${rel.inn.size} ${noun}</div>${chips(rel.inn)}</div>`;
}
function pickNode(n) {
  tsel = tsel && tsel.id === n.id ? null : mkSel(n); thover = null;
  if (tsel && n.unit) { reveal(n.id); renderTrees(); } else paintTrees();
}
$("#trees").addEventListener("click", e => {
  const tg = e.target.closest("[data-tog]");
  if (tg) { const k = tg.closest(".trow").dataset.k, id = tg.dataset.tog; collapsed[k].has(id) ? collapsed[k].delete(id) : collapsed[k].add(id); renderTrees(); return; }
  const pk = e.target.closest("[data-pick]");
  if (pk) { tsel = null; pickNode(NODES.folder[nodeIdOf(pk.dataset.pick)]); return; }
  if (e.target.closest("[data-clear]")) { tsel = null; paintTrees(); return; }
  const row = e.target.closest(".trow"); if (row) pickNode(NODES[row.dataset.k][row.dataset.id]);
});
$("#trees").addEventListener("keydown", e => {
  const row = e.target.closest(".trow"); if (!row || (e.key !== "Enter" && e.key !== " ") || e.target.closest("button")) return;
  e.preventDefault(); pickNode(NODES[row.dataset.k][row.dataset.id]);
});
const hoverTo = row => { const id = row ? row.dataset.k + row.dataset.id : null, cur = thover ? thover.key : null;
  if (id === cur) return; thover = row ? { ...mkSel(NODES[row.dataset.k][row.dataset.id]), key: id } : null; paintTrees(); };
$("#trees").addEventListener("mouseover", e => hoverTo(e.target.closest(".trow")));
$("#trees").addEventListener("mouseleave", () => hoverTo(null));
$("#trees").addEventListener("focusin", e => { const r = e.target.closest(".trow"); if (r) hoverTo(r); });
function pickArea(id) {
  const n = NODES.area["a:" + id];
  if (n) { tsel = mkSel(n); collapsed.area.delete(n.id); }
  renderTrees();
}
const linkCount = f => Object.keys(fOut[f] || {}).length + Object.keys(fIn[f] || {}).length;
const busiest = Object.keys(FILE).sort((a, b) => linkCount(b) - linkCount(a))[0];
if (busiest && linkCount(busiest)) { tsel = mkSel(NODES.folder["f:" + busiest]); reveal("f:" + busiest); }
renderTrees();

function showTab(t) {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  document.querySelectorAll(".tab").forEach(s => s.classList.toggle("on", s.id === "tab-" + t));
  $("#side").style.display = t === "map" ? "" : "none";
  document.querySelector("main").style.gridTemplateColumns = t === "map" ? "" : "minmax(0,1fr)";
  document.querySelector("main").style.gridTemplateRows = t === "map" ? "" : "auto";
  if (t === "map") fit();
  if (t === "trees") renderTrees();
}
document.querySelector("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) showTab(b.dataset.tab); });

$("#side").innerHTML = sideOverview();
legend(); paint(); fit();
</script>
